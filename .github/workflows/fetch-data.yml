# Runs the downloads on GitHub's machines (open internet) and stages the files as a Release on the
# PRIVATE input-staging repo, never on public ShroomHunt (plan §5 row 0A). Raw data never goes into
# git history: GBIF files can exceed GitHub's 100 MB file limit.
#
# One-time setup: repo Settings → Secrets and variables → Actions → add
#   GBIF_USER (username, not email), GBIF_PWD, GBIF_EMAIL
#   STAGING_REPO variable = owner/name of the private staging repo
#   STAGING_TOKEN secret = a fine-grained PAT with Contents read/write on that repo only
# See docs/private-input-staging.md.
name: Fetch data
on:
  workflow_dispatch:
    inputs:
      gbif:
        description: "GBIF downloads to request: all, none, or space-separated names (japan japan_dwca neighbours eastasia mushroomobserver)"
        type: string
        default: all
      resume_key:
        description: "Optional: an existing GBIF download key to collect instead of requesting a new one"
        required: false
      mushroomobserver:
        description: "Also try the CSVs direct from mushroomobserver.org (their server refused GitHub on 2026-11-21; GBIF has the same data)"
        type: boolean
        default: false
  # Monthly refresh. Each run creates new GBIF downloads with new DOIs, so leave this off until the pipeline is stable.
  # schedule:
  #   - cron: "17 3 2 * *"

permissions:
  contents: read   # the GITHUB_TOKEN must not be able to create public releases; staging uses STAGING_TOKEN

# One slot per kind of download, so a quick Mushroom Observer fetch isn't stuck behind a long GBIF wait
concurrency: fetch-data-${{ inputs.gbif }}-${{ inputs.mushroomobserver }}-${{ inputs.resume_key }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GBIF can take hours; if this times out, re-run with resume_key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: GBIF
        if: ${{ inputs.gbif != 'none' || inputs.resume_key != '' }}
        env:
          GBIF_USER: ${{ secrets.GBIF_USER }}
          GBIF_PWD: ${{ secrets.GBIF_PWD }}
          GBIF_EMAIL: ${{ secrets.GBIF_EMAIL }}
          WHICH: ${{ inputs.gbif }}
          RESUME: ${{ inputs.resume_key }}
        run: |
          if [ -n "$RESUME" ]; then python3 pipeline/gbif_request.py --resume "$RESUME"
          elif [ "$WHICH" = "all" ]; then python3 pipeline/gbif_request.py
          else python3 pipeline/gbif_request.py $WHICH; fi

      - name: Japan fungal Red List
        run: |
          command -v pdftotext >/dev/null 2>&1 || sudo apt-get install -y poppler-utils
          pip install duckdb==2.0.1                  # fetch_redlist_2025 loads the crosswalk (PR #3 review P1)
          python3 pipeline/fetch_redlist.py          # 2020 download: provenance + union fallback input
          python3 pipeline/fetch_col_mapping.py      # COL crosswalk into data/raw/col/ for the 2025 matcher
          python3 pipeline/fetch_redlist_2025.py     # 2025 PDF: the masking input (TASK-020, D12)

      - name: Mushroom Observer
        if: ${{ inputs.mushroomobserver }}
        run: |
          mkdir -p data/raw/mushroomobserver && cd data/raw/mushroomobserver
          for f in observations names locations; do
            curl -fsSL --retry 3 -o "$f.csv" "https://mushroomobserver.org/$f.csv"
            sleep 6   # stay well under MO's anonymous rate limit
          done
          gzip -9 *.csv

      - name: Inspect columns
        run: python3 pipeline/inspect_raw.py

      - name: Stage as a private release
        env:
          STAGING_REPO: ${{ vars.STAGING_REPO || secrets.STAGING_REPO }}
          STAGING_TOKEN: ${{ secrets.STAGING_TOKEN }}
        run: |
          shopt -s nullglob
          files=(data/raw/gbif/* data/raw/mushroomobserver/* data/raw/redlist/* docs/raw_schema.md)
          [ ${#files[@]} -gt 1 ] || { echo "Nothing downloaded"; exit 1; }
          [ -n "$STAGING_REPO" ] || { echo "::error::Set the STAGING_REPO variable (owner/name) to the private staging repo — see docs/private-input-staging.md"; exit 1; }
          [ -n "$STAGING_TOKEN" ] || { echo "::error::Set the STAGING_TOKEN secret (Contents read/write on $STAGING_REPO) — see docs/private-input-staging.md"; exit 1; }
          export GH_TOKEN="$STAGING_TOKEN"
          # Fail closed: the destination must exist, accept this token, and be private. Tested in tests/.
          python3 pipeline/fetch_latest_release_assets.py --verify-destination --repo "$STAGING_REPO"
          tag="data-$(date -u +%Y%m%d-%H%M)"
          notes="Raw downloads for ShroomHunt. Cite GBIF downloads by the DOI in each .json file."
          for j in data/raw/gbif/*.json; do notes="$notes"$'\n'"- $(basename "$j" .json): https://doi.org/$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['doi'])" "$j")"; done
          gh release create "$tag" "${files[@]}" --repo "$STAGING_REPO" --title "$tag" --notes "$notes"
          echo "### Release $tag created on $STAGING_REPO (private)" >> "$GITHUB_STEP_SUMMARY"; echo "$notes" >> "$GITHUB_STEP_SUMMARY"
